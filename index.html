<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE UNIVERSE</title>
  <meta name="description" content="A living, breathing cosmos — every star a story, every black hole a question.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @font-face {
      font-family: 'Nexokora';
      src: url('./nexokora-techno/NexokoraTechno-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #0E0E17;
      --cyan: #00d4ff;
      --cyan-dim: #3a7a8a;
      --cyan-glow: rgba(0, 212, 255, 0.5);
      --white: #f3f8f7;
      --muted: #8ab4c4;
      --font-d: 'Orbitron', sans-serif;
      --font-m: 'Space Mono', monospace;
    }

    @media (prefers-reduced-motion: no-preference) {
      @view-transition {
        navigation: auto;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: visible !important;
      background: #0E0E17;
      cursor: crosshair;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      position: relative;
      width: 100vw;
      height: 100vh;
      overscroll-behavior: none;
      user-select: none;
    }

    /* ── PRELOADER ── */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #preloader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none
    }

    .ld-rings {
      position: relative;
      width: 110px;
      height: 110px
    }

    .ld-r {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid transparent
    }

    .ld-r:nth-child(1) {
      border-top-color: var(--cyan);
      border-right-color: var(--cyan);
      opacity: .65;
      animation: sp 4.8s linear infinite
    }

    .ld-r:nth-child(2) {
      inset: 14px;
      border-bottom-color: var(--cyan);
      border-left-color: var(--cyan);
      opacity: .85;
      animation: sp 3.2s linear infinite reverse
    }

    .ld-r:nth-child(3) {
      inset: 28px;
      border-top-color: var(--cyan);
      border-right-color: var(--cyan);
      border-bottom-color: var(--cyan);
      animation: sp 2s linear infinite
    }

    @keyframes sp {
      to {
        transform: rotate(360deg)
      }
    }

    .ld-txt {
      margin-top: 28px;
      font-family: var(--font-m);
      font-size: .7rem;
      letter-spacing: .4em;
      color: var(--cyan);
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--cyan-glow);
      animation: pf 3s ease-in-out infinite;
    }

    @keyframes pf {

      0%,
      100% {
        opacity: .3
      }

      50% {
        opacity: 1
      }
    }

    /* ── STARS ── */
    #space-bg {
      position: fixed;
      inset: 0;
      background: #0E0E17;
      z-index: -1;
    }

    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: transparent;
      transition: transform 2.2s cubic-bezier(0.25, 1, 0.3, 1);
    }

    /* ── CANVAS — full viewport, behind everything ── */
    #creature {
      position: fixed;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 2;
      pointer-events: none;
      display: block;
      transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), transform 1.8s cubic-bezier(0.25, 1, 0.3, 1);
    }
    #creature.intro-hidden {
      opacity: 0;
    }
    #creature.intro-visible {
      opacity: 1;
      transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* ── VIGNETTE ── */
    .vig {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(3, 0, 10, .65) 100%);
    }

    /* ── TYPOGRAPHY ── */
    .t-the,
    .t-uni {
      position: absolute;
      z-index: 5;
      font-family: 'Nexokora', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: transparent;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1.5px #5ef6ff;
      text-shadow: 
        0 0 8px rgba(94, 246, 255, 0.6),
        0 0 20px rgba(94, 246, 255, 0.3),
        0 0 40px rgba(94, 246, 255, 0.1);
      line-height: .85;
      pointer-events: none;
      overflow: visible;
    }

    .t-the {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 10vw;
      overflow: visible;
    }
    .t-the.intro-hidden {
      opacity: 0;
      transform: translateX(-60px);
    }
    .t-the.intro-visible {
      opacity: 1;
      transform: translateX(0);
      transition: opacity 1s cubic-bezier(0.25, 1, 0.5, 1), transform 1s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .t-uni {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 10vw;
      overflow: visible;
    }
    .t-uni.intro-hidden {
      opacity: 0;
      transform: translateX(60px);
    }
    .t-uni.intro-visible {
      opacity: 1;
      transform: translateX(0);
      transition: opacity 1s cubic-bezier(0.25, 1, 0.5, 1), transform 1s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* ── BIO ── */
    .bio {
      position: absolute;
      z-index: 6;
      left: 3.5vw;
      top: 22%;
    }
    .bio.intro-hidden {
      opacity: 0;
      transform: translateY(20px);
    }
    .bio.intro-visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .bio-h {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: clamp(1rem, 1.5vw, 1.4rem);
      color: #5ef6ff;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 14px;
      text-shadow: 0 0 8px rgba(94, 246, 255, 0.5);
    }

    .bio-l {
      font-family: 'Orbitron', sans-serif;
      font-weight: 400;
      font-size: clamp(.85rem, 1.2vw, 1.15rem);
      color: #5ef6ff;
      line-height: 1.9;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    /* ── EXPLORE ── */
    .ex-wrap {
      position: absolute;
      z-index: 6;
      left: 3.5vw;
      bottom: 18vh;
    }
    .ex-wrap.intro-hidden {
      opacity: 0;
      transform: translateY(20px);
    }
    .ex-wrap.intro-visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .ex-btn {
      position: relative;
      width: clamp(150px, 13vw, 190px);
      height: clamp(150px, 13vw, 190px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform .35s ease;
      transform-style: preserve-3d;
    }

    .ex-btn::before, .ex-btn::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(94, 246, 255, 0.08);
      pointer-events: none;
    }
    .ex-btn::before {
      inset: 12px;
      box-shadow: inset 0 0 15px rgba(94, 246, 255, 0.03);
    }
    .ex-btn::after {
      inset: 28px;
    }

    .ex-btn:hover {
      transform: scale(1.06);
    }

    .ex-btn:hover .ex-orb {
      box-shadow: 0 0 50px rgba(255, 58, 58, 0.65), 0 0 90px rgba(255, 58, 58, 0.3);
    }

    .ex-ring {
      position: absolute;
      inset: 44px;
      border-radius: 50%;
      border: 1px dashed rgba(94, 246, 255, 0.15);
      pointer-events: none;
    }

    .ex-o1 {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      border: 3.5px solid transparent;
      border-bottom-color: rgba(94, 246, 255, 0.55);
      border-left-color: rgba(94, 246, 255, 0.25);
      animation: sweep-slow 12s linear infinite;
      pointer-events: none;
    }

    .ex-o1-dot {
      position: absolute;
      bottom: 14.6%;
      left: 14.6%;
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #5ef6ff, 0 0 16px #5ef6ff;
      transform: translate(-50%, 50%);
    }

    .ex-o2 {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: rgba(94, 246, 255, 0.35);
      border-right-color: rgba(94, 246, 255, 0.15);
      animation: sweep-fast 6s linear infinite reverse;
      pointer-events: none;
    }

    .ex-o2-dot {
      position: absolute;
      top: 14.6%;
      right: 14.6%;
      width: 4px;
      height: 4px;
      background: #ff3a3a;
      border-radius: 50%;
      box-shadow: 0 0 6px #ff3a3a;
      transform: translate(50%, -50%);
    }

    @keyframes sweep-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes sweep-fast {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .ex-orb {
      position: absolute;
      inset: 48px;
      background: 
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.18) 0%, transparent 40%),
        conic-gradient(from 120deg at 50% 50%, #ee3300 0deg, #3a0000 90deg, #cc2200 180deg, #0a0000 270deg, #ee3300 360deg),
        radial-gradient(circle at 50% 50%, #ee3300 0%, #8b0000 50%, #1a0000 100%);
      box-shadow: 0 0 35px rgba(238, 51, 0, 0.45), 0 0 70px rgba(139, 0, 0, 0.2);
      transition: box-shadow .35s ease;
      overflow: hidden;
      animation: blobby 8s ease-in-out infinite alternate;
    }

    @keyframes blobby {
      0% { border-radius: 40% 60% 55% 45% / 45% 55% 60% 40%; transform: rotate(0deg); }
      50% { border-radius: 50% 50% 40% 60% / 60% 40% 50% 50%; }
      100% { border-radius: 42% 58% 50% 50% / 50% 50% 58% 42%; transform: rotate(360deg); }
    }

    .ex-txt {
      position: relative;
      z-index: 3;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: clamp(1.1rem, 1.4vw, 1.35rem);
      color: #5ef6ff;
      letter-spacing: .22em;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 8px rgba(94, 246, 255, 0.5);
      transition: all 0.3s ease;
      white-space: nowrap;
      pointer-events: none;
    }

    .ex-btn:hover .ex-txt {
      color: #5ef6ff;
      text-shadow: 0 0 15px rgba(94, 246, 255, 0.75);
      transform: scale(1.05);
    }

    /* ── ORBITAL STACK ── */
    .os {
      position: absolute;
      z-index: 6;
      right: 3.5vw;
      top: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .os.intro-hidden {
      opacity: 0;
      transform: translate(30px, -50%);
    }
    .os.intro-visible {
      opacity: 1;
      transform: translate(0, -50%);
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .os-line {
      width: 1.5px;
      height: 36px;
      background: linear-gradient(to bottom, 
        rgba(94, 246, 255, 0.0) 0%, 
        rgba(94, 246, 255, 0.85) 50%, 
        rgba(94, 246, 255, 0.0) 100%);
      background-size: 100% 300%;
      animation: line-pulse 2.5s infinite linear;
    }

    @keyframes line-pulse {
      0% { background-position: 0% -150%; }
      100% { background-position: 0% 150%; }
    }

    .os-c {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .os-c:hover {
      transform: scale(1.08);
    }

    .os-bg {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      backdrop-filter: blur(3px);
      transition: all 0.4s ease;
      overflow: hidden;
    }

    .os-r {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      pointer-events: none;
    }

    /* Planet 1 specific styles (Ice/Ocean) */
    .os-p1 .os-bg {
      background: radial-gradient(circle at 30% 30%, #5ef6ff 0%, #004d61 50%, #001a24 100%);
      border: 1px solid rgba(94, 246, 255, 0.45);
      box-shadow: 0 0 10px rgba(94, 246, 255, 0.15);
    }
    .os-p1:hover .os-bg {
      box-shadow: 0 0 30px rgba(94, 246, 255, 0.8), inset 0 0 15px rgba(94, 246, 255, 0.4);
      border-color: #5ef6ff;
    }
    .planet-shimmer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 70% 70%, rgba(94, 246, 255, 0.4) 0%, transparent 60%);
      mix-blend-mode: overlay;
      animation: shimmer 3s ease-in-out infinite alternate;
    }
    @keyframes shimmer {
      0% { opacity: 0.3; transform: scale(0.95); }
      100% { opacity: 0.9; transform: scale(1.05); }
    }
    .os-p1 .os-r {
      border-top-color: rgba(94, 246, 255, 0.5);
      animation: sp 6s linear infinite;
    }
    .os-p1:hover .os-r {
      animation-duration: 2s;
    }
    .os-p1 .os-el {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      transform: rotateX(65deg) rotateZ(25deg);
      transform-style: preserve-3d;
      pointer-events: none;
    }
    .os-p1 .ring-inner {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(94, 246, 255, 0.25);
      border-bottom: 2px solid #5ef6ff;
      box-shadow: 0 2px 8px rgba(94, 246, 255, 0.4);
      animation: spin-ring-p1 8s linear infinite;
    }
    .os-p1:hover .ring-inner {
      animation-duration: 3s;
    }
    @keyframes spin-ring-p1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .os-p1 .ring-dot {
      position: absolute;
      top: -2px;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffffff, 0 0 12px #5ef6ff;
      transform: translate(-50%, -50%);
    }

    /* Planet 2 specific styles (Gas giant) */
    .os-p2 .os-bg {
      background: radial-gradient(circle at 30% 30%, #ffab40 0%, #aa44bb 60%, #3a005a 100%);
      border: 1px solid rgba(255, 171, 64, 0.4);
      box-shadow: 0 0 10px rgba(255, 171, 64, 0.15);
    }
    .os-p2:hover .os-bg {
      box-shadow: 0 0 30px rgba(255, 171, 64, 0.8), inset 0 0 15px rgba(255, 171, 64, 0.4);
      border-color: #ffab40;
    }
    .planet-bands {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 6px,
        rgba(255, 171, 64, 0.18) 6px,
        rgba(255, 171, 64, 0.18) 12px,
        rgba(170, 68, 187, 0.12) 12px,
        rgba(170, 68, 187, 0.12) 18px
      );
      opacity: 0.8;
      mix-blend-mode: overlay;
    }
    .os-p2 .os-r {
      border-top-color: rgba(255, 171, 64, 0.5);
      animation: sp 9s linear infinite reverse;
    }
    .os-p2:hover .os-r {
      animation-duration: 3s;
    }
    .os-p2 .os-el {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      transform: rotateX(70deg) rotateZ(-15deg);
      transform-style: preserve-3d;
      pointer-events: none;
    }
    .os-p2 .ring-inner {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px double rgba(255, 171, 64, 0.35);
      animation: spin-ring-p2 12s linear infinite;
    }
    .os-p2:hover .ring-inner {
      animation-duration: 4s;
    }
    @keyframes spin-ring-p2 {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    /* Planet 3 specific styles (Rocky/Lava) */
    .os-p3 .os-bg {
      background: radial-gradient(circle at 30% 30%, #ff4500 0%, #8b0000 60%, #1e0000 100%);
      border: 1px solid rgba(255, 69, 0, 0.4);
      box-shadow: 0 0 10px rgba(255, 69, 0, 0.15);
    }
    .os-p3:hover .os-bg {
      box-shadow: 0 0 30px rgba(255, 69, 0, 0.9), inset 0 0 15px rgba(255, 69, 0, 0.5);
      border-color: #ff4500;
    }
    .planet-cracks {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: 
        inset 0 0 12px rgba(255, 69, 0, 0.8),
        inset 8px 8px 16px rgba(0, 0, 0, 0.9),
        inset -8px -8px 16px rgba(255, 69, 0, 0.4);
      background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(255, 69, 0, 0.2) 100%);
    }
    .planet-cracks::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: 
        linear-gradient(45deg, transparent 48%, #ff4500 49%, #ff8c00 51%, transparent 52%),
        linear-gradient(-35deg, transparent 45%, #ff4500 47%, #ff8c00 49%, transparent 51%);
      background-size: 30px 30px;
      opacity: 0.55;
      mix-blend-mode: screen;
      filter: blur(0.5px);
    }
    .os-p3 .os-r {
      border-top-color: rgba(255, 69, 0, 0.5);
      animation: sp 11s linear infinite;
    }
    .os-p3:hover .os-r {
      animation-duration: 3s;
    }
    .os-p3 .os-el {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      transform: rotateX(75deg) rotateZ(45deg);
      transform-style: preserve-3d;
      pointer-events: none;
    }
    .os-p3 .ring-inner {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 69, 0, 0.4);
      border-left: 2.5px solid #ff4500;
      animation: spin-ring-p3 6s linear infinite;
    }
    .os-p3:hover .ring-inner {
      animation-duration: 2s;
    }
    @keyframes spin-ring-p3 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Moons orbiting each planet */
    .moon {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      z-index: 4;
      pointer-events: none;
    }
    .os-p1 .moon {
      background: #ffffff;
      box-shadow: 0 0 8px #5ef6ff, 0 0 16px #5ef6ff;
      animation: orbit-moon-1 4s linear infinite;
    }
    .os-p2 .moon {
      background: #ffab40;
      box-shadow: 0 0 8px #ffab40, 0 0 16px #aa44bb;
      animation: orbit-moon-2 6.5s linear infinite;
    }
    .os-p3 .moon {
      background: #ff8c00;
      box-shadow: 0 0 8px #ff4500, 0 0 16px #8b0000;
      animation: orbit-moon-3 3.5s linear infinite;
    }

    @keyframes orbit-moon-1 {
      from { transform: rotate(0deg) translate(65px) rotate(0deg); }
      to { transform: rotate(360deg) translate(65px) rotate(-360deg); }
    }
    @keyframes orbit-moon-2 {
      from { transform: rotate(0deg) translate(72px) rotate(0deg); }
      to { transform: rotate(360deg) translate(72px) rotate(-360deg); }
    }
    @keyframes orbit-moon-3 {
      from { transform: rotate(0deg) translate(60px) rotate(0deg); }
      to { transform: rotate(360deg) translate(60px) rotate(-360deg); }
    }

    /* Planet symbols styling */
    .os-p1 .os-s {
      color: #5ef6ff;
      text-shadow: 0 0 8px rgba(94, 246, 255, 0.8), 0 0 16px rgba(94, 246, 255, 0.3);
    }
    .os-p2 .os-s {
      color: #ffab40;
      text-shadow: 0 0 8px rgba(255, 171, 64, 0.8), 0 0 16px rgba(255, 171, 64, 0.3);
    }
    .os-p3 .os-s {
      color: #ff4500;
      text-shadow: 0 0 8px rgba(255, 69, 0, 0.8), 0 0 16px rgba(255, 69, 0, 0.3);
    }

    .os-s {
      position: relative;
      z-index: 2;
      font-size: 22px;
      transition: all 0.3s ease;
    }

    /* ── HUD ── */
    .hud {
      position: absolute;
      z-index: 5;
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--cyan-dim);
      letter-spacing: .05em;
      line-height: 1.75;
      text-transform: uppercase;
      pointer-events: none;
      opacity: .8;
    }

    .hud-tl {
      top: 18px;
      left: 18px
    }

    .hud-tr {
      top: 18px;
      right: 18px;
      text-align: right
    }
    .hud-tr.intro-hidden {
      opacity: 0;
    }
    .hud-tr.intro-visible {
      opacity: 0.8;
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .hud-bl {
      bottom: 18px;
      left: 18px
    }

    .hud-br {
      bottom: 18px;
      right: 18px;
      text-align: right
    }

    /* ── SCANLINES ── */
    .scan {
      position: fixed;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0, 0, 0, .04) 2px, rgba(0, 0, 0, .04) 4px);
      opacity: .4;
    }

    /* ── FADE IN ── */
    #page {
      opacity: 0;
      transition: opacity 0.1s ease;
      overflow: visible !important
    }

    #page.on {
      opacity: 1
    }

    /* ── RESPONSIVE ── */
    @media(max-width:768px) {
      .t-the {
        font-size: clamp(50px, 24vw, 200px);
        top: 0;
        left: 2vw
      }

      .t-uni {
        font-size: clamp(36px, 17vw, 150px);
        bottom: -1vw;
        right: -1vw
      }

      .bio {
        top: 26%;
        left: 3vw
      }

      .ex-wrap {
        left: 3vw;
        bottom: 10vh;
      }

      .ex-btn {
        width: 130px;
        height: 130px;
      }
      .ex-orb {
        inset: 32px !important;
      }
      .ex-ring {
        inset: 30px !important;
      }
      .ex-txt {
        font-size: 0.75rem !important;
        letter-spacing: 0.18em !important;
      }

      .os {
        right: 2vw
      }

      .os-c {
        width: 60px;
        height: 60px
      }

      .os-s {
        font-size: 14px
      }

      /* Responsive Planet Moons & Rings overrides */
      .os-p1 .moon { animation-name: orbit-moon-1-mobile; }
      .os-p2 .moon { animation-name: orbit-moon-2-mobile; }
      .os-p3 .moon { animation-name: orbit-moon-3-mobile; }
      
      .os-p1 .os-el { inset: -6px; }
      .os-p2 .os-el { inset: -10px; }
      .os-p3 .os-el { inset: -8px; }

      @keyframes orbit-moon-1-mobile {
        from { transform: rotate(0deg) translate(38px) rotate(0deg); }
        to { transform: rotate(360deg) translate(38px) rotate(-360deg); }
      }
      @keyframes orbit-moon-2-mobile {
        from { transform: rotate(0deg) translate(44px) rotate(0deg); }
        to { transform: rotate(360deg) translate(44px) rotate(-360deg); }
      }
      @keyframes orbit-moon-3-mobile {
        from { transform: rotate(0deg) translate(35px) rotate(0deg); }
        to { transform: rotate(360deg) translate(35px) rotate(-360deg); }
      }

      .hud {
        font-size: 8px
      }
    }

    /* ── EXPLORING WARP TRANSITIONS ── */
    body.exploring #creature {
      transform: perspective(1200px) rotateX(-55deg) translateZ(400px) translateY(-300px) scale(1.8) !important;
      opacity: 0 !important;
      transition: transform 2.0s cubic-bezier(0.25, 1, 0.3, 1), opacity 1.8s cubic-bezier(0.25, 1, 0.3, 1) !important;
    }

    body.exploring #starfield {
      transform: perspective(1200px) rotateX(-20deg) scale(1.2);
      transition: transform 2.2s cubic-bezier(0.25, 1, 0.3, 1);
    }

    body.exploring .t-the {
      transform: translateX(-150px) !important;
      opacity: 0 !important;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.3, 1), opacity 1.2s cubic-bezier(0.25, 1, 0.3, 1) !important;
    }

    body.exploring .t-uni {
      transform: translateX(150px) !important;
      opacity: 0 !important;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.3, 1), opacity 1.2s cubic-bezier(0.25, 1, 0.3, 1) !important;
    }

    body.exploring .bio {
      transform: translateY(50px) !important;
      opacity: 0 !important;
      transition: transform 1.0s cubic-bezier(0.25, 1, 0.3, 1), opacity 1.0s cubic-bezier(0.25, 1, 0.3, 1) !important;
    }

    body.exploring .ex-wrap {
      transform: scale(0.6) translateY(50px) !important;
      opacity: 0 !important;
      transition: transform 1.0s cubic-bezier(0.25, 1, 0.3, 1), opacity 1.0s cubic-bezier(0.25, 1, 0.3, 1) !important;
    }

    body.exploring .os {
      transform: translate(80px, -50%) !important;
      opacity: 0 !important;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.3, 1), opacity 1.2s cubic-bezier(0.25, 1, 0.3, 1) !important;
    }

    body.exploring .hud-tr {
      opacity: 0 !important;
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.3, 1) !important;
    }

    #transition-overlay {
      position: fixed;
      inset: 0;
      background: #0E0E17;
      opacity: 0;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    body.exploring #transition-overlay {
      opacity: 1;
      transition-delay: 1.3s;
    }
  </style>
</head>

<body>
  <div id="space-bg"></div>

  <!-- PRELOADER -->
  <div id="preloader">
    <div class="ld-rings">
      <div class="ld-r"></div>
      <div class="ld-r"></div>
      <div class="ld-r"></div>
    </div>
    <div class="ld-txt">Loading</div>
  </div>

  <div class="scan"></div>
  <canvas id="starfield"></canvas>

  <!-- CANVAS: full viewport, z-index 2, behind all UI -->
  <canvas id="creature" class="intro-hidden" data-intro="creature"></canvas>

  <div class="vig"></div>

  <div id="page">
    <div class="t-the intro-hidden" data-intro="the">THE</div>
    <div class="t-uni intro-hidden" data-intro="uni">UNIVERSE</div>

    <div class="bio intro-hidden" data-intro="bio">
      <div class="bio-h">A Living, Breathing Cosmos</div>
      <div class="bio-l">Every star a story.</div>
      <div class="bio-l">Every black hole a question.</div>
      <div class="bio-l">13.8 billion years in the making.</div>
    </div>

    <div class="ex-wrap intro-hidden" data-intro="ex-wrap">
      <a href="physics.html" class="ex-btn" aria-label="Explore the Universe">
        <div class="ex-o1">
          <div class="ex-o1-dot"></div>
        </div>
        <div class="ex-o2">
          <div class="ex-o2-dot"></div>
        </div>
        <div class="ex-ring"></div>
        <div class="ex-orb"></div>
        <span class="ex-txt">Explore</span>
      </a>
    </div>

    <div class="os intro-hidden" data-intro="os">
      <div class="os-c os-p1">
        <div class="os-bg">
          <div class="planet-shimmer"></div>
        </div>
        <div class="os-r"></div>
        <div class="os-el">
          <div class="ring-inner">
            <div class="ring-dot"></div>
          </div>
        </div>
        <div class="moon"></div>
        <span class="os-s">✦</span>
      </div>
      <div class="os-line"></div>
      <div class="os-c os-p2">
        <div class="os-bg">
          <div class="planet-bands"></div>
        </div>
        <div class="os-r"></div>
        <div class="os-el">
          <div class="ring-inner"></div>
        </div>
        <div class="moon"></div>
        <span class="os-s">◎</span>
      </div>
      <div class="os-line"></div>
      <div class="os-c os-p3">
        <div class="os-bg">
          <div class="planet-cracks"></div>
        </div>
        <div class="os-r"></div>
        <div class="os-el">
          <div class="ring-inner"></div>
        </div>
        <div class="moon"></div>
        <span class="os-s">⊕</span>
      </div>
    </div>
  </div>

  <script>
    /* ═══════════ STARS ═══════════ */
    let isExploring = false;
    let starSpeedMultiplier = 1;
    const starCanvas = document.getElementById('starfield');
    const renderer = new THREE.WebGLRenderer({ 
      canvas: starCanvas, 
      alpha: true,
      antialias: false 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.z = 500;

    // Create circular star texture
    const texCanvas = document.createElement('canvas');
    texCanvas.width = 32; texCanvas.height = 32;
    const ctx = texCanvas.getContext('2d');
    const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.7, 'rgba(255,255,255,0.85)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 32, 32);
    const starTexture = new THREE.CanvasTexture(texCanvas);

    const colorsList = [
      new THREE.Color('#ffffff'),
      new THREE.Color('#ffffff'),
      new THREE.Color('#aaddff'),
      new THREE.Color('#cceeff'),
      new THREE.Color('#ffffff'),
      new THREE.Color('#e8f4ff')
    ];

    // 1. Dynamic Stars (1500 stars)
    const dynamicCount = 1500;
    const dynamicGeometry = new THREE.BufferGeometry();
    const dynamicPositions = new Float32Array(dynamicCount * 3);
    const dynamicColors = new Float32Array(dynamicCount * 3);

    for (let i = 0; i < dynamicCount; i++) {
      dynamicPositions[i * 3] = (Math.random() - 0.5) * 2000;
      dynamicPositions[i * 3 + 1] = (Math.random() - 0.5) * 2000;
      dynamicPositions[i * 3 + 2] = (Math.random() - 0.5) * 1000;

      const color = colorsList[Math.floor(Math.random() * colorsList.length)];
      dynamicColors[i * 3] = color.r;
      dynamicColors[i * 3 + 1] = color.g;
      dynamicColors[i * 3 + 2] = color.b;
    }

    dynamicGeometry.setAttribute('position', new THREE.BufferAttribute(dynamicPositions, 3));
    dynamicGeometry.setAttribute('color', new THREE.BufferAttribute(dynamicColors, 3));

    const dynamicMaterial = new THREE.PointsMaterial({
      size: 6.0,
      map: starTexture,
      transparent: true,
      opacity: 0.95,
      sizeAttenuation: true,
      vertexColors: true,
      depthWrite: false
    });

    const dynamicStars = new THREE.Points(dynamicGeometry, dynamicMaterial);
    scene.add(dynamicStars);

    // 2. Static Stars (3500 stars)
    const staticCount = 3500;
    const staticGeometry = new THREE.BufferGeometry();
    const staticPositions = new Float32Array(staticCount * 3);
    const staticColors = new Float32Array(staticCount * 3);

    for (let i = 0; i < staticCount; i++) {
      staticPositions[i * 3] = (Math.random() - 0.5) * 2000;
      staticPositions[i * 3 + 1] = (Math.random() - 0.5) * 2000;
      staticPositions[i * 3 + 2] = (Math.random() - 0.5) * 1000;

      const color = colorsList[Math.floor(Math.random() * colorsList.length)];
      staticColors[i * 3] = color.r;
      staticColors[i * 3 + 1] = color.g;
      staticColors[i * 3 + 2] = color.b;
    }

    staticGeometry.setAttribute('position', new THREE.BufferAttribute(staticPositions, 3));
    staticGeometry.setAttribute('color', new THREE.BufferAttribute(staticColors, 3));

    const staticMaterial = new THREE.PointsMaterial({
      size: 4.0,
      map: starTexture,
      transparent: true,
      opacity: 0.85,
      sizeAttenuation: true,
      vertexColors: true,
      depthWrite: false
    });

    const staticStars = new THREE.Points(staticGeometry, staticMaterial);
    scene.add(staticStars);

    // Very subtle drift animation
    function animateStars() {
      requestAnimationFrame(animateStars);
      
      if (isExploring) {
        starSpeedMultiplier += 0.5;
        // Move camera forward (deep zoom)
        camera.position.z -= 18;
        // Shift camera upwards slightly for tilt sensation
        camera.position.y += 6;
        camera.rotation.x -= 0.004;
        
        dynamicStars.rotation.y += 0.002 * starSpeedMultiplier;
        dynamicStars.rotation.x += 0.001 * starSpeedMultiplier;
        staticStars.rotation.y += 0.0008 * starSpeedMultiplier;
      } else {
        dynamicStars.rotation.y += 0.00005;
        dynamicStars.rotation.x += 0.00002;
      }
      
      renderer.render(scene, camera);
    }
    animateStars();

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Remove all existing star divs
    document.querySelectorAll('.star').forEach(s => s.remove());

    /* ═══════════ CREATURE ═══════════ */
    !function () {
      var cv = document.getElementById('creature');
      var ctx = cv.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W, H;

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        cv.width = W * dpr;
        cv.height = H * dpr;
        cv.style.width = W + 'px';
        cv.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      var rotation = 0;
      var targetSpeed = 0.0008;
      var currentSpeed = 0.0008;
      var mouseMoveTimeout;

      window.addEventListener('mousemove', function () {
        targetSpeed = 0.003;
        clearTimeout(mouseMoveTimeout);
        mouseMoveTimeout = setTimeout(function () {
          targetSpeed = 0.0008;
        }, 200);
      });

      window.addEventListener('mouseleave', function () {
        clearTimeout(mouseMoveTimeout);
        targetSpeed = 0.0008;
      });

      var spots = [
        { idx: 20, color: '220, 20, 60', offset: 0 },
        { idx: 45, color: '0, 100, 255', offset: 1 },
        { idx: 70, color: '0, 255, 255', offset: 2 },
        { idx: 95, color: '255, 215, 0', offset: 3 },
        { idx: 120, color: '180, 0, 255', offset: 4 },
        { idx: 140, color: '50, 205, 50', offset: 5 }
      ];

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

      function draw(ts) {
        ctx.clearRect(0, 0, W, H);

        // Update rotation
        currentSpeed += (targetSpeed - currentSpeed) * 0.05;
        rotation += currentSpeed;

        var canvas = {
          width: W,
          height: H
        };

        // STEP 1 — Generate the S-curve path points:
        var points = [];
        var cx = canvas.width / 2 + (mouseX - window.innerWidth / 2) * 0.06;
        var cy = canvas.height / 2 + (mouseY - window.innerHeight / 2) * 0.06;
        for (var i = 0; i < 150; i++) {
          var t = (i / 150) * Math.PI * 3.5;
          var r = 15 + t * 28;
          points.push({
            x: cx + r * Math.cos(t + rotation),
            y: cy + r * Math.sin(t + rotation) * 0.6
          });
        }

        // STEP 2 — Draw the TUBE BODY:
        // First pass — outer dark body
        points.forEach(function (p) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 42, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(28, 16, 48, 0.92)';
          ctx.fill();
        });

        // Second pass — inner slightly lighter core
        points.forEach(function (p) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 26, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(38, 22, 62, 0.90)';
          ctx.fill();
        });

        // Third pass — subtle purple/dark edge glow
        points.forEach(function (p) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 44, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(80, 20, 120, 0.35)';
          ctx.lineWidth = 2;
          ctx.stroke();
        });

        // Fourth pass — faint cyan rim glow
        points.forEach(function (p) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 46, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(94, 246, 255, 0.06)';
          ctx.lineWidth = 3;
          ctx.stroke();
        });

        // STEP 3 — Add 6 glowing colored spots ON TOP of the tube:
        var time = ts * 0.002;
        spots.forEach(function (spot) {
          var p = points[spot.idx];
          if (!p) return;
          var rGlow = 14 + Math.sin(time + spot.offset) * 4;
          var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rGlow);
          grad.addColorStop(0, 'rgba(' + spot.color + ', 0.5)');
          grad.addColorStop(1, 'rgba(' + spot.color + ', 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, rGlow, 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    }();

    /* ── INTRO SEQUENCE ── */
    function runIntro() {
      const sequence = [
        { key: 'creature', delay: 400 },
        { key: 'the', delay: 800 },
        { key: 'uni', delay: 1200 },
        { key: 'bio', delay: 1600 },
        { key: 'ex-wrap', delay: 2000 },
        { key: 'os', delay: 2400 },
        { key: 'hud-tr', delay: 2800 }
      ];

      sequence.forEach(item => {
        setTimeout(() => {
          let el;
          if (item.key === 'creature') {
            el = document.getElementById('creature');
          } else {
            el = document.querySelector(`[data-intro="${item.key}"]`);
            if (!el && item.key === 'hud-tr') {
              el = document.querySelector('.hud-tr');
            }
          }
          if (el) {
            el.classList.remove('intro-hidden');
            el.classList.add('intro-visible');
          }
        }, item.delay);
      });
    }

    /* ── EXPLORE BUTTON TRANSITION INTERCEPTOR ── */
    function setupExploreTransition() {
      const exploreBtn = document.querySelector('.ex-btn');
      if (exploreBtn) {
        exploreBtn.addEventListener('click', function (e) {
          e.preventDefault();
          const targetUrl = this.getAttribute('href');
          
          // Trigger transition states
          isExploring = true;
          document.body.classList.add('exploring');
          
          // Delay redirection to allow animation sequence to play
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 1800);
        });
      }
    }

    /* ── PRELOADER ── */
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.getElementById('preloader').classList.add('done');
        document.getElementById('page').classList.add('on');
        runIntro();
        setupExploreTransition();
      }, 2000);
    });
  </script>
  <div id="transition-overlay"></div>
</body>
